# supervisord.conf generated from original Dockerfile
[supervisord]
#run supervisord in foreground
nodaemon = true

[program:postfix]
process_name    = postfix
autostart       = true
autorestart     = true
directory       = /opt
command         = /opt/postfix.sh
startsecs       = 1
stdout_logfile  = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile  = /dev/stderr
stderr_logfile_maxbytes = 0

[program:syslog]
process_name    = syslog
autostart       = true
autorestart     = true
directory       = /etc
command         = /sbin/syslogd -n -O /dev/stdout
startsecs       = 1
stdout_logfile  = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile  = /dev/stderr
stderr_logfile_maxbytes = 0
