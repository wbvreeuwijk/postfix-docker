# supervisord.conf generated from original Dockerfile
[supervisord]
#run supervisord in foreground
nodaemon = true

[program:postfix]
process_name    = postfix
autostart       = true
autorestart     = false
directory       = /opt
command         = /opt/postfix.sh
startsecs       = 0

[program:syslog]
process_name    = syslog
autostart       = true
autorestart     = false
directory       = /etc
command         = /sbin/syslogd
startsecs       = 0
